<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/sockjs/1.1.4/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

    <div>
      <button onclick="connect()">Connect</button>
    </div>

    <div>
        <input type="text" id="name" placeholder="username">
        <input type="text" id="message" placeholder=chatMessage>
        <button onclick="submit()">Submit</button>


    </div>

    <ul id="list">

    </ul>

    <script>
        document.addEventListener("DOMContentLoaded",()=>{
            connect();
        })
         function connect(){
            const socket=new SockJS("http://localhost:8085/ws")
            stompClient=Stomp.over(socket)
            stompClient.connect({},function(){
                console.log("connected")
                stompClient.subscribe("/topic/ping",function(message){
                    console.log("received a new message from the server",message)
                })

                stompClient.subscribe("/topic/scheduled",function(message){
                    console.log("received a new message from the server",message)
                    const li=document.createElement("li")
                    li.textContent=message.body;
                    document.getElementById("list").appendChild(li)
                })

                stompClient.subscribe("/topic/message",function(data){
                  
                   // console.log(data.body)
                   const msg = JSON.parse(data.body);
                console.log(typeof msg)
                const li = document.createElement("li");
                li.textContent = `${msg.name} : ${msg.timeStamp} - ${msg.message}` ;
                document.getElementById("list").appendChild(li);
                   
                })

                stompClient.subscribe("/topic/newRideRequest",function(data){
                  
                  //console.log(data.body)
                 // const msg = JSON.parse(data.body)
                 const bookingID=JSON.parse(data.body).bookingID
                 const response=confirm(` You have a new Ride from Passenger :${JSON.parse(data.body).passengerID}.Do you want to accept it?`)
                 //console.log(data.body)
                 if(response==true){
                    const id=prompt("Please Enter your DriverId");
                    stompClient.send(`/app/rideResponse/${id}`,{},JSON.stringify({response,bookingID}));
                 }
                 //stompClient.send("/app/rideResponse",{},JSON.stringify({response}));

               
                  
               })
                


              



            })
         }


         function submit(){
           // const value=document.getElementById("name").value; 
           // const username=document.getElementById("name").value;  
           const name = document.getElementById("name").value; 
           const message=document.getElementById("message").value
           // stompClient.send("/app/chat",{},JSON.stringify({data:value}))
           stompClient.send("/app/chat",{},JSON.stringify({name,message}));
         
         }


    </script>
    
</body>
</html>
